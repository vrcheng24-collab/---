<!doctype html>
<html><head><meta charset="utf-8"><title>ALPHA head rig</title>
<style>html,body{margin:0;background:#0d0e10;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
// ALPHA head rig, built from the white model photos (units ~cm).
// Fixed: crown, forehead, brows, eyes, nose, cheek panels, upper lip, mouth cavity.
// Moving: one jaw group (lower lip + chin + chin side plates) rotating down/back around a hinge axis behind the cheeks.
// Secondary: stepped neck yaw, eyebrow lift, eyelid drop, ear turbine spin.
import * as THREE from "three";

const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1280), H = +(Q.get("h") || 548);
const MODE = Q.get("mode") || "white";          // white | paint
const VIEW = Q.get("view") || "34";             // 34 | front | side
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e10);
scene.fog = new THREE.Fog(0x0d0e10, 60, 140);

// ---------------------------------------------------------------- materials
const P = MODE === "paint";
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, metalness: 0.05, flatShading: true, ...o });
const mat = {
  face:   P ? M(0xb9bcc0, { metalness: 0.75, roughness: 0.35 }) : M(0x9b9c9e),
  panel:  P ? M(0xa9adb2, { metalness: 0.7, roughness: 0.4 }) : M(0x929395),
  helmet: P ? M(0xe8c21a, { metalness: 0.3, roughness: 0.35 }) : M(0x8e8f91),
  accent: P ? M(0x2bb3c0, { metalness: 0.3, roughness: 0.35 }) : M(0x949597),
  lip:    P ? M(0x33b9c6, { metalness: 0.45, roughness: 0.3 }) : M(0xa3a4a6),
  dark:   M(0x101113, { roughness: 0.9 }),
  motor:  M(0xb08a3a, { metalness: 0.8, roughness: 0.35 }),
  servo:  M(0x6a1518, { roughness: 0.6 }),
  glass:  new THREE.MeshPhysicalMaterial({ color: 0x1a1d22, roughness: 0.05, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05 }),
  iris:   new THREE.MeshStandardMaterial({ color: P ? 0x3a4cff : 0x2a2c30, emissive: P ? 0x2a36d8 : 0x000000, emissiveIntensity: P ? 1.4 : 0 }),
  fin:    P ? M(0xf0cc1c, { metalness: 0.3, roughness: 0.35 }) : M(0xd8d8d6),
};

// ---------------------------------------------------------------- helpers
const BEND = 0.075;                                       // face curvature: z -= BEND * x^2
function bend(geo, k = BEND, cx = 0) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i) - cx; p.setZ(i, p.getZ(i) - k * x * x); }
  p.needsUpdate = true; geo.computeVertexNormals(); return geo;
}
function plate(pts, depth = 1.2, bevel = 0.25, o = {}) {
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: 4 });
  g.translate(0, 0, -depth);                               // front face at z = 0
  if (o.bend !== false) bend(g, o.k ?? BEND, o.cx ?? 0);
  return g;
}
function mesh(g, m, parent, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const o = new THREE.Mesh(g, m); o.position.set(...pos); o.rotation.set(...rot);
  o.castShadow = o.receiveShadow = true; parent.add(o); return o;
}
const mirror = (pts) => pts.map(([x, y]) => [-x, y]).reverse();

// ---------------------------------------------------------------- head
const neckYaw = new THREE.Group(); scene.add(neckYaw);
const head = new THREE.Group(); neckYaw.add(head); head.scale.set(1.12, 1, 1);   // the real face is broad

// skull + helmet shell
const skull = new THREE.SphereGeometry(1, 14, 10); skull.scale(10.8, 13.5, 11.5);
mesh(skull, mat.panel, head, [0, 3, -3.5]);
// crown ridge (raised centre plate over the forehead and top)
mesh(plate([[-3.6, 0], [3.6, 0], [3.0, 9], [-3.0, 9]], 2.2, 0.4, { bend: false }), mat.helmet, head, [0, 8.5, 9.6], [-0.28, 0, 0]);
mesh(new THREE.BoxGeometry(6.4, 2.4, 14), mat.helmet, head, [0, 16.2, 0], [0, 0, 0]);
// forehead panels with the A-shaped recess (two plates each side)
for (const s of [-1, 1]) {
  const fh = [[1.6, 4.6], [9.6, 4.0], [10.2, 10.5], [3.4, 12.2], [1.6, 10.8]];
  mesh(plate(s < 0 ? mirror(fh) : fh, 1.0, 0.2, { k: 0.06 }), mat.face, head, [0, 0.4, 10.4], [-0.12, 0, 0]);
  const a = [[3.6, 6.0], [5.6, 10.2], [7.6, 6.0], [6.6, 6.0], [5.6, 8.2], [4.6, 6.0]];
  mesh(plate(s < 0 ? mirror(a) : a, 0.5, 0.08, { k: 0.06 }), mat.accent, head, [0, 0.4, 10.9], [-0.12, 0, 0]);
}
// nose: bridge + faceted tip block
mesh(plate([[-1.25, -1.5], [1.25, -1.5], [1.4, 7.0], [-1.4, 7.0]], 1.4, 0.3, { bend: false }), mat.face, head, [0, -2.5, 11.4], [-0.12, 0, 0]);
mesh(plate([[-1.9, 0], [1.9, 0], [1.5, 2.6], [-1.5, 2.6]], 2.4, 0.35, { bend: false }), mat.face, head, [0, -6.3, 12.6], [-0.35, 0, 0]);
// eyes: glass lens, rim, iris, layered upper lids, chain eyebrows
const lids = [], brows = [];
for (const s of [-1, 1]) {
  const eye = new THREE.Group(); eye.position.set(s * 5.0, 2.2, 8.9); eye.rotation.y = s * 0.28; head.add(eye);
  const lens = new THREE.SphereGeometry(2.25, 24, 16); lens.scale(1.3, 0.64, 0.55);                // almond-shaped lens eye
  mesh(lens, mat.glass, eye, [0, 0, 0.3]);
  mesh(new THREE.CircleGeometry(0.75, 20), mat.iris, eye, [0, 0, 1.6]);
  mesh(new THREE.TorusGeometry(2.45, 0.28, 6, 22), mat.panel, eye, [0, 0, 0.6]).scale.set(1.24, 0.66, 1);
  const lidG = new THREE.Group(); lidG.position.set(0, 0.6, 0.2); eye.add(lidG); lids.push(lidG);
  for (let k = 0; k < 3; k++) {
    const g = new THREE.CylinderGeometry(2.7 - k * 0.08, 2.7 - k * 0.08, 0.32, 18, 1, true, -1.15, 2.3);
    mesh(g, mat.face, lidG, [0, 0.55 + k * 0.38, -1.4], [Math.PI / 2, 0, 0]).material.side = THREE.DoubleSide;
  }
  // segmented eyebrow: 10 links on an arc, pivoting as one strip
  const br = new THREE.Group(); br.position.set(s * 5.0, 5.0, 10.0); br.rotation.y = s * 0.28; head.add(br); brows.push(br);
  for (let k = 0; k < 10; k++) {
    const u = (k / 9) * 2 - 1, x = u * 4.2, y = 0.9 - 0.75 * u * u - (s * u < 0 ? 0 : 0.15);
    mesh(new THREE.BoxGeometry(0.72, 0.42, 0.5), mat.panel, br, [x, y, 0], [0, 0, -u * 0.35]);
  }
  // cheek panels (fixed): upper cheek, lower side plate
  const ck = [[2.2, -0.2], [9.4, 0.6], [10.0, -5.6], [7.4, -9.6], [4.2, -6.4], [2.0, -5.0]];
  mesh(plate(s < 0 ? mirror(ck) : ck, 1.3, 0.25, { k: 0.085 }), mat.face, head, [0, -1.2, 9.6]);
  const lc = [[4.4, -7.9], [7.6, -10.6], [9.4, -6.6], [10.2, -9.4], [7.0, -15.2], [4.6, -14.0]];
  mesh(plate(s < 0 ? mirror(lc) : lc, 1.3, 0.25, { k: 0.085 }), mat.panel, head, [0, -0.6, 8.9]);
  // ear turbine
  const ear = new THREE.Group(); ear.position.set(s * 11.2, 1.5, -1); ear.rotation.z = Math.PI / 2; head.add(ear);
  mesh(new THREE.CylinderGeometry(3.6, 3.8, 2.6, 24), mat.panel, ear);
  mesh(new THREE.TorusGeometry(2.9, 0.35, 8, 24), mat.face, ear, [0, s * 1.35, 0], [Math.PI / 2, 0, 0]);
  const fan = new THREE.Group(); fan.position.y = s * 1.2; ear.add(fan); ear.userData.fan = fan;
  for (let k = 0; k < 9; k++) mesh(new THREE.BoxGeometry(0.35, 0.25, 2.5), mat.dark, fan, [Math.cos(k * 0.7) * 1.3, 0, Math.sin(k * 0.7) * 1.3], [0, -k * 0.7, 0.4]);
  head.userData[s < 0 ? "earL" : "earR"] = fan;
  // head fin
  mesh(plate([[0, 0], [1.8, 0], [0.4, 6.5]], 1.0, 0.2, { bend: false }), mat.fin, head, [s * 9.2, 11.5, 0.5], [0, s * 1.2, s * -0.5]);
}
// upper lip (fixed): one faceted shell, philtrum notch, pointed wedge corners
const ul = [[-4.3, -0.15], [-1.4, 0.95], [-0.45, 1.0], [0, 0.62], [0.45, 1.0], [1.4, 0.95], [4.3, -0.15], [1.6, -0.75], [0, -0.55], [-1.6, -0.75]];
mesh(plate(ul, 1.7, 0.32, { k: 0.12 }), mat.lip, head, [0, -8.25, 12.0], [0.12, 0, 0]);
// mouth cavity (fixed, inside): dark box + two gold gear motors + red servos
const cav = new THREE.Group(); cav.position.set(0, -9.9, 8.3); head.add(cav);
mesh(new THREE.BoxGeometry(7.0, 3.4, 5.2), mat.dark, cav, [0, 0, -1.8]);
for (const s of [-1, 1]) {
  mesh(new THREE.CylinderGeometry(0.55, 0.55, 1.6, 12), mat.motor, cav, [s * 0.9, 0.2, 1.4], [Math.PI / 2, 0, 0]);
  mesh(new THREE.BoxGeometry(2.0, 1.8, 1.2), mat.servo, cav, [s * 2.6, 0.5, 0.9]);
}
// ---------------------------------------------------------------- the jaw (only moving part of the mouth)
const HINGE = new THREE.Vector3(0, -9.0, 2.5);           // axis through both side hinges, behind the cheek panels
const jaw = new THREE.Group(); jaw.position.copy(HINGE); head.add(jaw);
const J = (x, y, z) => [x - HINGE.x, y - HINGE.y, z - HINGE.z];
const ll = [[-4.2, 0.15], [0, 0.42], [4.2, 0.15], [3.4, -0.65], [1.5, -1.25], [0, -1.35], [-1.5, -1.25], [-3.4, -0.65]];
mesh(plate(ll, 1.6, 0.3, { k: 0.12 }), mat.lip, jaw, J(0, -9.42, 11.75), [-0.05, 0, 0]);   // closed: meets the upper lip
mesh(plate([[-1.6, 0], [1.6, 0], [1.4, -4.4], [-1.4, -4.4]], 1.3, 0.25, { bend: false }), mat.face, jaw, J(0, -11.2, 11.5), [-0.18, 0, 0]);
mesh(new THREE.BoxGeometry(0.3, 1.4, 0.4), mat.dark, jaw, J(0, -14.4, 11.0));
for (const s of [-1, 1]) {
  const cs = [[1.5, 0.2], [4.6, 0.6], [4.4, -2.8], [2.6, -4.6], [1.5, -4.6]];
  mesh(plate(s < 0 ? mirror(cs) : cs, 1.2, 0.22, { k: 0.1 }), mat.panel, jaw, J(0, -11.0, 10.7), [-0.15, 0, 0]);
  mesh(new THREE.BoxGeometry(1.0, 1.0, 6), mat.dark, jaw, J(s * 3.4, -10.4, 5.0));    // jaw arms back to the hinge (hidden behind the cheeks)
}
mesh(new THREE.BoxGeometry(6.6, 0.6, 3.8), mat.dark, jaw, J(0, -10.3, 8.6));          // floor of the mouth
// neck
mesh(new THREE.CylinderGeometry(3.3, 3.8, 9, 12), mat.dark, neckYaw, [0, -18, -3]);
for (let k = 0; k < 6; k++) mesh(new THREE.CylinderGeometry(0.35, 0.35, 9, 6), mat.panel, neckYaw, [Math.cos(k) * 3.6, -18, -3 + Math.sin(k) * 3.6]);

// ---------------------------------------------------------------- light + camera
scene.add(new THREE.HemisphereLight(P ? 0x3a4250 : 0x8a9099, 0x0a0a0a, P ? 0.55 : 1.1));
const key = new THREE.SpotLight(P ? 0xffd6a0 : 0xfff2e6, P ? 2600 : 3400, 0, 0.55, 0.6, 2); key.position.set(-26, 34, 30); key.target.position.set(0, -3, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0008; key.shadow.normalBias = 0.06; scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0x9fb6c8, P ? 0.35 : 0.9); fill.position.set(30, 0, 25); scene.add(fill);
const rim = new THREE.DirectionalLight(0xbfe6ff, 1.1); rim.position.set(25, 20, -30); scene.add(rim);
const cam = new THREE.PerspectiveCamera(26, W / H, 1, 400);
const VIEWS = { "34": [[38, 0, 62], [0, -2.5, 0]], front: [[0, 0, 74], [0, -2.5, 0]], side: [[74, -1, 4], [0, -2.5, 0]], mouth: [[16, -6, 40], [0, -8.5, 6]] };
const [cp, ct] = VIEWS[VIEW] || VIEWS["34"]; cam.position.set(...cp); cam.lookAt(...ct);

// ---------------------------------------------------------------- animation API
let curve = null, yawSteps = [];
window.load = (c, steps) => { curve = c; yawSteps = steps || []; };
function servoStep(t, t0, from, to, dur = 0.14) {                       // fast start, hard stop, tiny rebound
  if (t <= t0) return from; const u = Math.min(1, (t - t0) / dur);
  const e = 1 - Math.pow(1 - u, 3); const rb = u >= 1 ? Math.exp(-(t - t0 - dur) * 30) * Math.sin((t - t0 - dur) * 70) * 0.06 : 0;
  return from + (to - from) * (e + rb);
}
window.setFrame = (i, staticDeg) => {
  const fps = curve ? curve.fps : 24, t = i / fps;
  const deg = staticDeg ?? (curve ? curve.frames[Math.min(i, curve.frames.length - 1)] : 0);
  jaw.rotation.x = THREE.MathUtils.degToRad(deg);
  const open = curve ? deg / curve.max_deg : 0;
  let yaw = 0; for (const [t0, to] of yawSteps) yaw = t >= t0 ? servoStep(t, t0, yaw, to) : yaw;
  neckYaw.rotation.y = THREE.MathUtils.degToRad(yaw);
  for (const b of brows) b.position.y = 5.0 + Math.max(0, open - 0.6) * 0.9;
  for (const l of lids) l.rotation.x = -Math.max(0, open - 0.6) * 0.25;
  head.userData.earL.rotation.y = head.userData.earR.rotation.y = t * 2.2;
  renderer.render(scene, cam);
  return deg;
};
window.setFrame(0, 0);
window.ready = true;
</script></body></html>
